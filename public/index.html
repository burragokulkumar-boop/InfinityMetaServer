<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wonder Kiosk</title>
<style>
:root{
  --bg:#05070d;--panel:#0b101b;--panel2:#0f1624;--text:#edf4ff;--muted:#8290a8;
  --line:#1b2940;--accent:#38a3ff;--accent2:#7b5cff;--green:#20d394;--red:#ff5570;
  --shadow:0 18px 55px rgba(0,0,0,.38);--radius:18px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:
 radial-gradient(circle at 12% 0%,rgba(56,163,255,.13),transparent 30%),
 radial-gradient(circle at 88% 15%,rgba(123,92,255,.11),transparent 28%),
 linear-gradient(145deg,#05070d,#080d16 55%,#05070d);color:var(--text);
 font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px}
button{font:inherit;cursor:pointer}
.header{height:76px;background:rgba(7,11,19,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.22)}
.brand{font-size:21px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.brand:before{content:"◈";color:var(--accent);margin-right:10px;text-shadow:0 0 16px rgba(56,163,255,.7)}
.brand span{color:#fff}
.container{max-width:1220px;margin:0 auto;padding:34px 22px 50px;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h1,h2,h3{margin:0}
h1{font-size:31px;letter-spacing:-.035em}
.subtitle{color:var(--muted);margin-top:5px}
.status{display:flex;align-items:center;gap:9px;color:#aebbd0;border:1px solid var(--line);background:rgba(12,18,30,.72);padding:8px 12px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:#69758a;box-shadow:0 0 0 3px rgba(105,117,138,.1)}
.dot.live{background:var(--green);box-shadow:0 0 12px rgba(32,211,148,.9)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card,.panel{background:linear-gradient(145deg,rgba(15,22,36,.96),rgba(8,13,23,.96));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card:before,.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.65}
.card{padding:21px;transition:.18s transform,.18s border-color,.18s box-shadow}
.card:hover{transform:translateY(-4px);border-color:#28517a;box-shadow:0 22px 60px rgba(0,0,0,.48),0 0 30px rgba(56,163,255,.07)}
.device-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.device-name{font-weight:750;font-size:17px;letter-spacing:.01em}
.badge{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#182235;color:#8f9db4;border:1px solid #26344b}
.badge.online{background:rgba(32,211,148,.1);color:#4df0b5;border-color:rgba(32,211,148,.25);box-shadow:0 0 16px rgba(32,211,148,.08)}
.badge.offline{background:rgba(255,85,112,.08);color:#ff8a9e;border-color:rgba(255,85,112,.2)}
.meta{margin:17px 0;color:var(--muted);font-size:12px}
.meta div{margin:7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:#b9c6d9;font-weight:650}
.open{width:100%;border:1px solid rgba(56,163,255,.45);border-radius:12px;background:linear-gradient(135deg,#1685e8,#5b58ff);color:#fff;padding:12px;font-weight:750;letter-spacing:.02em;box-shadow:0 8px 22px rgba(56,163,255,.18)}
.open:hover{filter:brightness(1.12);box-shadow:0 10px 28px rgba(56,163,255,.28)}
.empty{background:rgba(10,16,27,.8);border:1px dashed #293952;border-radius:var(--radius);padding:55px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
.back{border:1px solid var(--line);background:rgba(12,18,30,.75);color:#8dcaff;padding:8px 12px;border-radius:10px;margin-bottom:16px;font-weight:700}
.back:hover{border-color:#31527a;background:#101a2a}
.detail{display:grid;grid-template-columns:1.45fr .75fr;gap:18px}
.panel{padding:23px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:18px}
.info{border:1px solid #1a2940;background:rgba(10,16,27,.7);border-radius:13px;padding:13px}
.info small{display:block;color:#708098;margin-bottom:4px;text-transform:uppercase;font-size:10px;letter-spacing:.08em}
.info strong{display:block;overflow-wrap:anywhere;color:#dce7f7}
.section-title{font-size:15px;font-weight:800;letter-spacing:.02em;margin-bottom:14px}
.actions{display:grid;gap:10px}
.action{border:1px solid #20304a;background:linear-gradient(145deg,#101a2a,#0c1422);color:#dce7f7;border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;transition:.15s}
.action:hover{border-color:#31527a;transform:translateX(2px);background:#121e30}
.action.danger{border-color:rgba(255,85,112,.25);color:#ff8b9e}
.action.primary{background:linear-gradient(135deg,#1685e8,#5b58ff);color:#fff;border-color:transparent;box-shadow:0 8px 24px rgba(56,163,255,.16)}
.action.green{background:rgba(32,211,148,.09);color:#4df0b5;border-color:rgba(32,211,148,.22)}
.log{max-height:330px;overflow:auto;border-top:1px solid var(--line);margin-top:15px}
.log-row{padding:11px 0;border-bottom:1px solid #18253a;font-size:12px}
.log-row b{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#65b8ff}
.notice{position:fixed;right:18px;bottom:18px;background:#111b2b;color:#fff;border:1px solid #2a405f;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);z-index:50}
@media(max-width:800px){.detail{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.info-grid{grid-template-columns:1fr}.header{padding:0 16px}}
</style>
</head>
<body>
<header class="header"><div class="brand"><span>Wonder</span> Kiosk</div></header>

<main class="container">
  <section id="devicesPage">
    <div class="top">
      <div>
        <h1>Devices</h1>
        <div class="subtitle">All connected tablets · live kiosk control center.</div>
      </div>
      <div class="status"><span id="serverDot" class="dot"></span><span id="serverText">Checking server…</span></div>
    </div>
    <div id="deviceGrid" class="grid"></div>
  </section>

  <section id="detailPage" class="hidden">
    <button class="back" onclick="showDevices()">← All devices</button>
    <div class="top">
      <div>
        <h1 id="detailTitle">Device</h1>
        <div class="subtitle" id="detailSubtitle"></div>
      </div>
      <div id="detailBadge" class="badge"></div>
    </div>

    <div class="detail">
      <div class="panel">
        <div class="section-title">Device information</div>
        <div id="infoGrid" class="info-grid"></div>
        <div class="section-title" style="margin-top:25px">Command history</div>
        <div id="history" class="log"></div>
      </div>

      <div class="panel">
        <div class="section-title">Kiosk controls</div>
        <div class="actions">
          <button class="action primary" onclick="send('PING')">Test connection</button>
          <button class="action green" onclick="send('ENTER_KIOSK')">Enter kiosk</button>
          <button class="action" onclick="send('RESTART_KIOSK')">Restart kiosk</button>
          <button class="action" onclick="showMessage()">Show message</button>
          <button class="action" onclick="confirmClearData()">Clear Infinity Learn data</button>
          <button class="action danger" onclick="confirmExit()">Exit kiosk</button>
        </div>
        <div class="section-title" style="margin-top:25px">Status</div>
        <div id="statusText" class="subtitle">Ready.</div>
      </div>
    </div>
  </section>
</main>
<div id="notice" class="notice hidden"></div>

<script>
let selected=null;
let history=[];

async function api(path,options){
  const r=await fetch(path,options);
  const text=await r.text();
  let data={}; try{data=text?JSON.parse(text):{}}catch{}
  if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
  return data;
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const n=document.getElementById('notice'); n.textContent=msg;n.classList.remove('hidden');
  clearTimeout(window._toast);window._toast=setTimeout(()=>n.classList.add('hidden'),2600);
}
function setServer(ok){
  document.getElementById('serverDot').className='dot '+(ok?'live':'');
  document.getElementById('serverText').textContent=ok?'Server online':'Server unavailable';
}
async function loadDevices(){
  try{
    const h=await api('/api/health'); setServer(h.status==='ok');
    const data=await api('/api/admin/devices');
    const grid=document.getElementById('deviceGrid');
    if(!data.devices?.length){
      grid.innerHTML='<div class="empty">No kiosk devices are registered yet.</div>';return;
    }
    grid.innerHTML=data.devices.map(d=>{
      const name=d.model||'Unknown tablet';
      return '<article class="card">'+
        '<div class="device-head"><div class="device-name">'+esc(name)+'</div>'+
        '<span class="badge '+(d.online?'online':'offline')+'">'+(d.online?'Online':'Offline')+'</span></div>'+
        '<div class="meta"><div><b>Device ID:</b> '+esc(d.deviceId)+'</div>'+
        '<div><b>Android:</b> '+esc(d.androidVersion)+' (SDK '+esc(d.sdk)+')</div>'+
        '<div><b>App:</b> '+esc(d.packageName)+' · v'+esc(d.appVersion)+'</div>'+
        '<div><b>Last seen:</b> '+esc(formatDate(d.lastSeen))+'</div></div>'+
        '<button class="open" onclick="openDevice('+JSON.stringify(d.deviceId)+')">Open device</button></article>';
    }).join('');
  }catch(e){setServer(false);document.getElementById('deviceGrid').innerHTML='<div class="empty">Unable to load devices. '+esc(e.message)+'</div>'}
}
function formatDate(v){try{return new Date(v).toLocaleString()}catch{return v||'—'}}
async function openDevice(id){
  selected=id; document.getElementById('devicesPage').classList.add('hidden');document.getElementById('detailPage').classList.remove('hidden');
  await loadDetail();
}
function showDevices(){selected=null;document.getElementById('detailPage').classList.add('hidden');document.getElementById('devicesPage').classList.remove('hidden');loadDevices()}
async function loadDetail(){
  try{
    const r=await api('/api/admin/devices/'+encodeURIComponent(selected));const d=r.device;
    document.getElementById('detailTitle').textContent=d.model||'Unknown tablet';
    document.getElementById('detailSubtitle').textContent=d.deviceId;
    const b=document.getElementById('detailBadge');b.textContent=d.online?'Online':'Offline';b.className='badge '+(d.online?'online':'offline');
    const rows=[['Device ID',d.deviceId],['Model',d.model],['Android',d.androidVersion],['SDK',d.sdk],['Package',d.packageName],['App version',d.appVersion],['Registered',formatDate(d.registeredAt)],['Last seen',formatDate(d.lastSeen)]];
    document.getElementById('infoGrid').innerHTML=rows.map(x=>'<div class="info"><small>'+esc(x[0])+'</small><strong>'+esc(x[1])+'</strong></div>').join('');
    const h=await api('/api/admin/command-history?limit=100');
    history=h.history.filter(x=>x.deviceId===selected).reverse();
    document.getElementById('history').innerHTML=history.length?history.map(x=>'<div class="log-row"><b>'+esc(x.status)+'</b> · '+esc(x.commandId)+'<br>'+esc(x.message||'')+'<br><span class="subtitle">'+esc(formatDate(x.acknowledgedAt))+'</span></div>').join(''):'<div class="subtitle" style="padding-top:12px">No command acknowledgements yet.</div>';
  }catch(e){toast(e.message)}
}
async function send(type,message=''){
  if(!selected)return;
  try{
    await api('/api/admin/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:selected,type,message})});
    document.getElementById('statusText').textContent=type+' queued for delivery.';
    toast(type+' queued');
    setTimeout(loadDetail,800);
  }catch(e){toast(e.message)}
}
function showMessage(){
  const m=prompt('Message to display on the tablet:');
  if(m!==null && m.trim())send('SHOW_MESSAGE',m.trim());
}
function confirmExit(){
  if(confirm('Send Exit Kiosk to this device?'))send('EXIT_KIOSK');
}
function confirmClearData(){
  if(confirm('Clear all Infinity Learn app data on this device? This cannot be undone.'))send('CLEAR_APP_DATA');
}
loadDevices();
setInterval(()=>selected?loadDetail():loadDevices(),15000);
</script>
</body>
</html>
